services:
  weekmand:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      # Zelfde waarde als bij ports: alleen op 127.0.0.1 mag je via localhost Picnic en AH koppelen.
      DOCKER_BIND_IP: ${BIND_IP:-127.0.0.1}
      APP_PASSWORD: ${APP_PASSWORD:-}
      API_TOKEN: ${API_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NTFY_URL: ${NTFY_URL:-}
      MQTT_URL: ${MQTT_URL:-}
      CUTOFF_WARNING_HOURS: ${CUTOFF_WARNING_HOURS:-4}
    volumes:
      - weekmand:/data
    mem_limit: 150m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  weekmand:
